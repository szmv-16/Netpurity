name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # 仓库里的 .npmrc 指向国内镜像，在 GitHub Runner 上会很慢，这里改回官方源
      npm_config_registry: https://registry.npmjs.org
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build bundles
        run: pnpm build

      # 只在打 tag 或手动触发时产出安装包，PR 只做类型检查
      - name: Package Windows
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: pnpm dist

      - name: Zip portable folder
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          Compress-Archive -Path dist\win-unpacked\* -DestinationPath dist\NetPurity-win64.zip -Force

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: NetPurity-windows
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NetPurity ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
